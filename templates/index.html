<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻读 QingDu - HSK Chinese Analyzer</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h1>轻读 QingDu</h1>
    </div>

    <!-- Overlay for sidebar -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>
        </div>
        
        <div class="sidebar-section">
            <h3>Texts</h3>
            <div class="sidebar-item" onclick="showNewTextInput()">
                <span class="sidebar-item-icon">+</span>
                <span>New Text</span>
            </div>
            <div id="textsList"></div>
        </div>
        
        <div class="sidebar-section">
            <h3>Vocabulary Lists</h3>
            <div id="vocabularyLists"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Input Section -->
        <div class="input-section" id="inputSection">
            <div class="input-placeholder" id="inputPlaceholder">
                Click here to enter new Chinese text...
            </div>
            
            <div class="input-content" id="inputContent">
                <h3>Enter Chinese Text</h3>
                <div class="stats" id="vocabStats">
                    Vocabulary: <span id="vocabCount">Loading...</span>
                </div>
                <textarea id="textInput" placeholder="Enter your Chinese text here...">我今天去学校学习中文。老师教我们很多新的汉字。我觉得中文很有意思,但是也很难。</textarea>
                <button class="btn" onclick="analyzeText()">Analyze Text</button>
                <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <div class="text-panel">
                <div class="text-panel-header">
                    <h3>Reading Text</h3>
                    <button class="save-text-btn" id="saveTextBtn" onclick="saveCurrentText()" disabled>
                        <span>💾</span>
                        <span>Save Text</span>
                    </button>
                </div>
                <div class="reading-text" id="readingArea"></div>
            </div>
            
            <div class="info-panel">
                <div class="word-info-panel" id="wordInfo">
                    <h4>Word Information</h4>
                    <p>Click on a colored word to see details</p>
                </div>
                
                <div class="sentence-info-panel" id="sentenceInfo">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h4>Sentence Translation</h4>
                        <button class="tts-btn" onclick="speakSentence()">🔊 Play</button>
                    </div>
                    <p id="sentenceText"></p>
                    <p id="sentenceTranslation" style="margin-top: 10px; color: #666;"></p>
                </div>
                
                <div class="stats-panel" id="statistics">
                    <h4>Statistics</h4>
                    <div id="statsContent"></div>
                </div>
            </div>
        </div>

        <!-- List View Section -->
        <div class="list-view-section hidden" id="listViewSection">
            <div class="list-view-header">
                <h3 id="listViewTitle">Vocabulary List</h3>
                <button class="btn btn-secondary" onclick="closeListView()">Back</button>
            </div>
            <div id="listViewContent"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/vocabulary.js"></script>
    <script src="/static/js/display.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/vocabulary.js"></script>
    <script src="/static/js/display.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
