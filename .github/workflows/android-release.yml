name: Android Release APK

# Triggers a release-signed APK build on tag push (v* tags). The artifact
# is attached to the GitHub Release the tag created. Every build is signed
# with the maintainer's release keystore (stored as GitHub Secrets) so
# upgrades work in-place and the same APK lineage can later go to F-Droid
# / Play Store without a signature rotation.
#
# Required GitHub Secrets:
#   RELEASE_KEYSTORE_B64       — base64 of qingdu-release.keystore
#   RELEASE_KEYSTORE_PASSWORD  — keystore password (PKCS12: also the key pwd)
#   RELEASE_KEY_ALIAS          — usually "qingdu"
#
# If those secrets aren't set (forks, PR runs), build.gradle falls back to
# the ambient debug keystore so the build still produces an installable
# debug APK — just not one the maintainer would distribute.
#
# Manual dispatch is also wired up so the maintainer can rebuild the same
# tag on demand (e.g. if a step flaked).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.1) — leave empty to build the current commit"
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Build Vite bundle
        working-directory: frontend
        env:
          # Bake the production URL in so the bundled SPA points at the
          # public host regardless of where the wrapper was built.
          VITE_API_BASE_URL: https://qingdu.itvoodoo.at
        run: npm run build

      - name: Capacitor sync Android
        working-directory: frontend
        run: npx cap sync android

      - name: Decode release keystore (if secret present)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > frontend/android/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "release keystore prepared"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no release keystore secret — falling back to debug signing"
          fi

      - name: Assemble release APK
        working-directory: frontend/android
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.keystore.outputs.present == 'true' && format('{0}/frontend/android/release.keystore', github.workspace) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to tagged filename
        id: rename
        env:
          SIGNED: ${{ steps.keystore.outputs.present }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          # When the release keystore signed it, gradle drops the suffix from
          # the filename. When it didn't, it's debug-signed but still emitted
          # by the release task — we tag the filename accordingly.
          if [ "$SIGNED" = "true" ]; then
            src="frontend/android/app/build/outputs/apk/release/app-release.apk"
            dst="qingdu-${tag}.apk"
          else
            src="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
            [ -f "$src" ] || src="frontend/android/app/build/outputs/apk/release/app-release.apk"
            dst="qingdu-${tag}-debug.apk"
          fi
          cp "$src" "$dst"
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -lh "$dst"

      - name: Clean up keystore
        if: always()
        run: rm -f frontend/android/release.keystore

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk }}
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### APK for sideloading

            Download `${{ steps.rename.outputs.apk }}` below and install it on
            an Android device with "Install from unknown sources" enabled.

            > Release-signed with the maintainer's keystore — installs
            > cleanly on top of any previous v1.0.2+ build. If you have a
            > pre-v1.0.2 debug-signed APK installed, uninstall it first
            > (signature mismatch).
