name: Android Debug APK

# Triggers a debug-signed APK build on tag push (v* tags). The artifact is
# attached to the GitHub Release the tag created. Interim before the
# release-signed AAB flow for F-Droid / Play Store; the debug signature
# means anyone can sideload but won't be able to upgrade across a future
# release-signed build (the system blocks the install on signature
# mismatch and the user has to uninstall first).
#
# Manual dispatch is also wired up so the maintainer can rebuild the same
# tag on demand (e.g. if a step flaked).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.1) — leave empty to build the current commit"
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm deps
        working-directory: frontend
        run: npm ci

      - name: Build Vite bundle
        working-directory: frontend
        env:
          # Bake the production URL in so the bundled SPA points at the
          # public host regardless of where the wrapper was built.
          VITE_API_BASE_URL: https://qingdu.itvoodoo.at
        run: npm run build

      - name: Capacitor sync Android
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to tagged filename
        id: rename
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          src="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          dst="qingdu-${tag}-debug.apk"
          cp "$src" "$dst"
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ls -lh "$dst"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk }}
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Debug APK for sideloading

            Download `${{ steps.rename.outputs.apk }}` below and install it on
            an Android device with "Install from unknown sources" enabled.

            > This is a debug-signed build. If you've previously installed a
            > different debug build of QingDu, Android will refuse the upgrade
            > on signature mismatch — uninstall the old version first.
            >
            > A release-signed AAB for F-Droid and Play Store is the next
            > milestone; the keystore for that lives outside the repo.
