name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
          ALLOWED_ORIGINS: "*"
        shell: bash
        # Failing test ids are surfaced as annotations so they show up on the
        # run summary without opening the full log.
        run: |
          status=0
          pytest -rfE 2>&1 | tee pytest.log || status=$?
          grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | sed 's/^/::error::/' || true
          exit $status

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npm test
