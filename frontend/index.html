<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>轻读 QingDu</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <!-- The Noto SC stylesheet is injected at runtime by main.ts (web only), so
         the Capacitor build never opens a connection to Google. -->
    <!-- Early error capture: Capacitor's bridge script runs before the
         module bundle, so main.ts's handlers would miss errors from that
         window. These format errors as 'name: message' like main.ts. -->
    <script>
      (function () {
        function describe(err) {
          if (err && typeof err === "object" && (err.name || err.message)) {
            return (err.name || "Error") + ": " + (err.message || "");
          }
          return String(err);
        }
        window.addEventListener("error", function (e) {
          console.error("[early-onerror] " + describe(e.error || e.message));
        });
        window.addEventListener("unhandledrejection", function (e) {
          console.error("[early-rejection] " + describe(e.reason));
        });
      })();
    </script>
  </head>
  <body class="h-full bg-bg text-fg antialiased">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
