<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>轻读 QingDu</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32x32.png"
    />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <!-- Note: previously preconnected to fonts.googleapis.com / fonts.gstatic.com
         for CJK glyphs. Moved to a runtime-only `<link rel=stylesheet>` injected
         by main.ts so the Capacitor (Android / F-Droid) build never opens an
         outbound socket to Google. Web users still get Noto SC on first render. -->
    <!-- Early error capture. Capacitor's bridge script runs inline BEFORE
         the module bundle initialises Vue, so the global handlers we wire
         up in main.ts can miss errors from that window (e.g. the
         Capacitor.Plugins.X.triggerEvent quirk that fires when a plugin
         races the bridge's ready signal). Hook the listeners here so
         they exist from the very first tick — they reformat unknown
         errors into 'name: message' strings the same way main.ts does
         later. -->
    <script>
      (function () {
        function describe(err) {
          if (err && typeof err === "object" && (err.name || err.message)) {
            return (err.name || "Error") + ": " + (err.message || "");
          }
          return String(err);
        }
        window.addEventListener("error", function (e) {
          console.error("[early-onerror] " + describe(e.error || e.message));
        });
        window.addEventListener("unhandledrejection", function (e) {
          console.error("[early-rejection] " + describe(e.reason));
        });
      })();
    </script>
  </head>
  <body class="h-full bg-bg text-fg antialiased">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
