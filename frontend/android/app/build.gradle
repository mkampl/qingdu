apply plugin: 'com.android.application'

android {
    namespace "at.itvoodoo.qingdu"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "at.itvoodoo.qingdu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "1.0.52"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing reads from the environment so the maintainer's
    // keystore never has to land in the repo. CI decodes the base64
    // RELEASE_KEYSTORE_B64 secret to ../release.keystore before invoking
    // gradle; locally the maintainer can `export` the same vars.
    //
    // If RELEASE_KEYSTORE_FILE is unset (anyone other than the maintainer),
    // gradle falls back to the debug keystore so a contributor can still
    // build a debug APK from a fresh checkout without any setup.
    signingConfigs {
        release {
            def keystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")
            if (keystoreFile && new File(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "qingdu"
                keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("RELEASE_KEYSTORE_FILE")
            if (keystoreFile && new File(keystoreFile).exists()) {
                signingConfig signingConfigs.release
            }
            // No keystore -> leave the release build UNSIGNED. F-Droid's
            // buildserver requires app-release-unsigned.apk (they sign with
            // their own key); the previous debug-keystore fallback made
            // gradle emit a debug-signed app-release.apk and would have
            // failed their pipeline. Forks that want an installable build
            // without secrets can use assembleDebug.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
// The Capacitor template's google-services block used to live here. It was
// inert (no google-services.json has ever been in this repo) but F-Droid
// reviewers rightly flag any GMS wiring - removed together with the
// classpath in ../build.gradle. Push notifications are deliberately not a
// thing; reminders are local notifications.
