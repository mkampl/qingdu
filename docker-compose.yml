# Production compose. No host source mounts — the image is the artefact.
# Use docker-compose.dev.yml for local development.
services:
  web:
    build: .
    container_name: chinese_analyzer
    ports:
      # BIND_ADDRESS=127.0.0.1 keeps the port off the public interface when a
      # reverse proxy on the same host fronts it (Docker bypasses ufw).
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:8000"
    volumes:
      # Only persistent data is mounted. The application code lives inside
      # the image, so a restart without a rebuild never runs code from disk.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env file}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      # CORS: unset (the default) allows no cross-origin requests; the SPA
      # and API share one origin. Set a comma-separated list or '*' in .env
      # when another origin needs access (see app/main.py).
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Peers allowed to set X-Forwarded-For. See .env.example.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - WORKERS=2
      - RELOAD=false
      # Legal pages — all optional, unset = no Impressum page. See
      # .env.example for what each var means.
      - IMPRESSUM_NAME=${IMPRESSUM_NAME:-}
      - IMPRESSUM_STREET=${IMPRESSUM_STREET:-}
      - IMPRESSUM_ZIP=${IMPRESSUM_ZIP:-}
      - IMPRESSUM_CITY=${IMPRESSUM_CITY:-}
      - IMPRESSUM_COUNTRY=${IMPRESSUM_COUNTRY:-}
      - IMPRESSUM_EMAIL=${IMPRESSUM_EMAIL:-}
      - IMPRESSUM_PHONE=${IMPRESSUM_PHONE:-}
      - IMPRESSUM_EXTRA=${IMPRESSUM_EXTRA:-}
      - PRIVACY_PAGE_ENABLED=${PRIVACY_PAGE_ENABLED:-}
    env_file:
      - .env
    restart: unless-stopped
    # healthcheck is defined in Dockerfile (uses urllib from stdlib)
