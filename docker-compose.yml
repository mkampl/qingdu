version: '3.8'

services:
  web:
    build: .
    container_name: chinese_analyzer
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Mount code for development (remove in production)
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      # Persistent data
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Security - REQUIRED
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env file}
      # Translation API keys (optional)
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      # CORS Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - WORKERS=2
      - RELOAD=false
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  vocabulary_data:
    driver: local
