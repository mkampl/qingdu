version: '3.8'

services:
  web:
    build: .
    container_name: chinese_analyzer
    ports:
      - "8000:8000"
    volumes:
      # Mount code for development (remove in production)
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      # Persistent data
      - vocabulary_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  vocabulary_data:
    driver: local
