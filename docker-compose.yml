# Production compose. No host source mounts — the image is the artefact.
# Use docker-compose.dev.yml for local development.
services:
  web:
    build: .
    container_name: chinese_analyzer
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Only persistent data is mounted. The application code lives inside
      # the image so a pull-and-restart-without-rebuild can't end up running
      # whatever happens to be on disk in /root/qingdu/app.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env file}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      # CORS: leave unset in production to default to the public origin
      # (see app/main.py). Override via .env / Ansible for staging hosts.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - WORKERS=2
      - RELOAD=false
    env_file:
      - .env
    restart: unless-stopped
    # healthcheck is defined in Dockerfile (uses urllib from stdlib)
